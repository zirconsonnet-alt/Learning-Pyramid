services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
      args:
        PIP_INDEX_URL: ${PLM_PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${PLM_PIP_EXTRA_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PLM_PIP_TRUSTED_HOST:-}
        PIP_DEFAULT_TIMEOUT: ${PLM_PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PLM_PIP_RETRIES:-10}
        PLM_FRONTEND_DIST_FINGERPRINT: ${PLM_FRONTEND_DIST_FINGERPRINT:-}
    ports:
      - "${PLM_PORT:-8001}:8001"
    environment:
      PLM_APP_MODE: ${PLM_APP_MODE:-hosted}
      PLM_PORT: 8001
      PLM_BIND_HOST: 0.0.0.0
      PLM_SQL_BACKEND: ${PLM_SQL_BACKEND:-sqlite}
      PLM_POSTGRES_DSN: ${PLM_POSTGRES_DSN:-}
      PLM_LOG_LEVEL: ${PLM_LOG_LEVEL:-INFO}
      PLM_POSTGRES_CONNECT_TIMEOUT: ${PLM_POSTGRES_CONNECT_TIMEOUT:-5}
      PLM_POSTGRES_POOL_ACQUIRE_TIMEOUT: ${PLM_POSTGRES_POOL_ACQUIRE_TIMEOUT:-10}
      PLM_POSTGRES_POOL_MIN_SIZE: ${PLM_POSTGRES_POOL_MIN_SIZE:-1}
      PLM_POSTGRES_POOL_MAX_SIZE: ${PLM_POSTGRES_POOL_MAX_SIZE:-8}
      PLM_POSTGRES_STATEMENT_TIMEOUT_MS: ${PLM_POSTGRES_STATEMENT_TIMEOUT_MS:-30000}
      PLM_POSTGRES_LOCK_TIMEOUT_MS: ${PLM_POSTGRES_LOCK_TIMEOUT_MS:-5000}
      PLM_POSTGRES_IDLE_IN_TX_TIMEOUT_MS: ${PLM_POSTGRES_IDLE_IN_TX_TIMEOUT_MS:-30000}
      PLM_STORE_DB_PATH: /data/plm_store.sqlite3
      PLM_AUTH_DB_PATH: /data/plm_auth.sqlite3
      PLM_ENABLE_AUTH: ${PLM_ENABLE_AUTH:-true}
      PLM_ALLOW_SIGNUP: ${PLM_ALLOW_SIGNUP:-false}
      PLM_REQUIRE_SIGNUP_INVITE: ${PLM_REQUIRE_SIGNUP_INVITE:-true}
      PLM_BOOTSTRAP_SUPER_ADMIN_EMAILS: ${PLM_BOOTSTRAP_SUPER_ADMIN_EMAILS:-}
      PLM_ENABLE_PASSWORD_RESET: ${PLM_ENABLE_PASSWORD_RESET:-false}
      PLM_PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PLM_PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      PLM_ENABLE_EMAIL_VERIFICATION: ${PLM_ENABLE_EMAIL_VERIFICATION:-false}
      PLM_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: ${PLM_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:-1440}
      PLM_ENABLE_SIGNUP_HUMAN_CHECK: ${PLM_ENABLE_SIGNUP_HUMAN_CHECK:-false}
      PLM_ALTCHA_HMAC_SECRET: ${PLM_ALTCHA_HMAC_SECRET:-}
      PLM_ALTCHA_CHALLENGE_URL: ${PLM_ALTCHA_CHALLENGE_URL:-/api/auth/human-check/challenge}
      PLM_ALTCHA_ALGORITHM: ${PLM_ALTCHA_ALGORITHM:-SHA-256}
      PLM_ALTCHA_COST: ${PLM_ALTCHA_COST:-1000}
      PLM_ALTCHA_CHALLENGE_TTL_SECONDS: ${PLM_ALTCHA_CHALLENGE_TTL_SECONDS:-600}
      PLM_SMTP_HOST: ${PLM_SMTP_HOST:-}
      PLM_SMTP_PORT: ${PLM_SMTP_PORT:-587}
      PLM_SMTP_USERNAME: ${PLM_SMTP_USERNAME:-}
      PLM_SMTP_PASSWORD: ${PLM_SMTP_PASSWORD:-}
      PLM_SMTP_USE_SSL: ${PLM_SMTP_USE_SSL:-false}
      PLM_SMTP_USE_STARTTLS: ${PLM_SMTP_USE_STARTTLS:-true}
      PLM_SMTP_FROM_EMAIL: ${PLM_SMTP_FROM_EMAIL:-}
      PLM_SMTP_FROM_NAME: ${PLM_SMTP_FROM_NAME:-LearningPyramid}
      PLM_SMTP_TIMEOUT_SECONDS: ${PLM_SMTP_TIMEOUT_SECONDS:-10}
      PLM_ENABLE_ASR: ${PLM_ENABLE_ASR:-false}
      PLM_ENABLE_SERVER_MEDIA_STREAM: ${PLM_ENABLE_SERVER_MEDIA_STREAM:-false}
      PLM_ENABLE_BROWSER_LOCAL_MEDIA: ${PLM_ENABLE_BROWSER_LOCAL_MEDIA:-true}
      PLM_ENABLE_BAIDU_NETDISK: ${PLM_ENABLE_BAIDU_NETDISK:-false}
      PLM_BAIDU_NETDISK_CLIENT_ID: ${PLM_BAIDU_NETDISK_CLIENT_ID:-}
      PLM_BAIDU_NETDISK_CLIENT_SECRET: ${PLM_BAIDU_NETDISK_CLIENT_SECRET:-}
      PLM_BAIDU_NETDISK_REDIRECT_URI: ${PLM_BAIDU_NETDISK_REDIRECT_URI:-}
      PLM_BAIDU_NETDISK_SCOPE: ${PLM_BAIDU_NETDISK_SCOPE:-basic,netdisk}
      PLM_TOKEN_ENCRYPTION_KEY: ${PLM_TOKEN_ENCRYPTION_KEY:-}
      PLM_DATA_DIR: /data
      PLM_SECURE_COOKIES: ${PLM_SECURE_COOKIES:-true}
      PLM_PUBLIC_HOST: ${PLM_PUBLIC_HOST:-}
      PLM_PUBLIC_ORIGIN: ${PLM_PUBLIC_ORIGIN:-}
      PLM_ALLOWED_ORIGINS: ${PLM_ALLOWED_ORIGINS:-}
      PLM_TRUSTED_HOSTS: ${PLM_TRUSTED_HOSTS:-}
      PLM_PROXY_HEADERS: ${PLM_PROXY_HEADERS:-true}
      PLM_FORWARDED_ALLOW_IPS: ${PLM_FORWARDED_ALLOW_IPS:-127.0.0.1}
      PLM_MEDIA_ACCESS_TOKEN_TTL_SECONDS: ${PLM_MEDIA_ACCESS_TOKEN_TTL_SECONDS:-14400}
      PLM_MEDIA_ACCESS_TOKEN_SECRET: ${PLM_MEDIA_ACCESS_TOKEN_SECRET:-}
      PLM_WECHAT_PAY_APP_ID: ${PLM_WECHAT_PAY_APP_ID:-}
      PLM_WECHAT_PAY_MCH_ID: ${PLM_WECHAT_PAY_MCH_ID:-}
      PLM_WECHAT_PAY_CERT_SERIAL_NO: ${PLM_WECHAT_PAY_CERT_SERIAL_NO:-}
      PLM_WECHAT_PAY_API_V3_KEY: ${PLM_WECHAT_PAY_API_V3_KEY:-}
      PLM_WECHAT_PAY_PRIVATE_KEY_PEM_PATH: ${PLM_WECHAT_PAY_PRIVATE_KEY_PEM_PATH:-}
      PLM_WECHAT_PAY_PUBLIC_KEY_ID: ${PLM_WECHAT_PAY_PUBLIC_KEY_ID:-}
      PLM_WECHAT_PAY_PUBLIC_KEY_PEM_PATH: ${PLM_WECHAT_PAY_PUBLIC_KEY_PEM_PATH:-}
      PLM_WECHAT_PAY_NOTIFY_URL: ${PLM_WECHAT_PAY_NOTIFY_URL:-}
      PLM_WECHAT_PAY_REFUND_NOTIFY_URL: ${PLM_WECHAT_PAY_REFUND_NOTIFY_URL:-}
      PLM_WECHAT_PAY_API_BASE_URL: ${PLM_WECHAT_PAY_API_BASE_URL:-https://api.mch.weixin.qq.com}
      PLM_WECHAT_PAY_TIMEOUT_SECONDS: ${PLM_WECHAT_PAY_TIMEOUT_SECONDS:-10}
      PLM_WECHAT_PAY_DESCRIPTION_PREFIX: ${PLM_WECHAT_PAY_DESCRIPTION_PREFIX:-LearningPyramid 月会员}
      PLM_WECHAT_PAY_APP_SECRET: ${PLM_WECHAT_PAY_APP_SECRET:-}
      PLM_WECHAT_PAY_PAYOUT_PROVIDER_MODE: ${PLM_WECHAT_PAY_PAYOUT_PROVIDER_MODE:-wechat_native}
      PLM_WECHAT_PAY_BINDING_QR_TTL_MINUTES: ${PLM_WECHAT_PAY_BINDING_QR_TTL_MINUTES:-10}
      PLM_WECHAT_PAY_TRANSFER_SCENE_ID: ${PLM_WECHAT_PAY_TRANSFER_SCENE_ID:-}
      PLM_WECHAT_PAY_TRANSFER_REMARK: ${PLM_WECHAT_PAY_TRANSFER_REMARK:-会员邀请佣金提现}
      PLM_WECHAT_PAY_USER_RECV_PERCEPTION: ${PLM_WECHAT_PAY_USER_RECV_PERCEPTION:-}
      PLM_WECHAT_PAY_TRANSFER_NOTIFY_URL: ${PLM_WECHAT_PAY_TRANSFER_NOTIFY_URL:-}
      PLM_WECHAT_PAY_TRANSFER_SCENE_REPORT_INFOS_JSON: ${PLM_WECHAT_PAY_TRANSFER_SCENE_REPORT_INFOS_JSON:-}
      PLM_WECHAT_PAY_OAUTH_AUTHORIZE_URL: ${PLM_WECHAT_PAY_OAUTH_AUTHORIZE_URL:-https://open.weixin.qq.com/connect/oauth2/authorize}
      PLM_WECHAT_PAY_OAUTH_TOKEN_URL: ${PLM_WECHAT_PAY_OAUTH_TOKEN_URL:-https://api.weixin.qq.com/sns/oauth2/access_token}
      PLM_MEMBERSHIP_COMMISSION_REFUND_WINDOW_MINUTES: ${PLM_MEMBERSHIP_COMMISSION_REFUND_WINDOW_MINUTES:-1440}
      PLM_MEMBERSHIP_PENDING_PAYMENT_RECONCILE_MIN_AGE_MINUTES: ${PLM_MEMBERSHIP_PENDING_PAYMENT_RECONCILE_MIN_AGE_MINUTES:-5}
      PLM_MEMBERSHIP_PENDING_PAYMENT_RECONCILE_LIMIT: ${PLM_MEMBERSHIP_PENDING_PAYMENT_RECONCILE_LIMIT:-100}
    volumes:
      - ./data/selfhost:/data
      - ./data/selfhost:/app/data
      - ${PLM_WECHAT_PAY_CERTS_DIR:-./certs}:/app/certs:ro
      - ./public-downloads:/app/public-downloads:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; host=(os.getenv('PLM_PUBLIC_HOST') or next((item.strip() for item in os.getenv('PLM_TRUSTED_HOSTS', '').split(',') if item.strip()), 'localhost')); req=urllib.request.Request('http://127.0.0.1:8001/api/health/live', headers={'Host': host}); urllib.request.urlopen(req, timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
