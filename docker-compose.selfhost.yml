services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
      args:
        PIP_INDEX_URL: ${LEARNINGPYRAMID_PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${LEARNINGPYRAMID_PIP_EXTRA_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${LEARNINGPYRAMID_PIP_TRUSTED_HOST:-}
        PIP_DEFAULT_TIMEOUT: ${LEARNINGPYRAMID_PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${LEARNINGPYRAMID_PIP_RETRIES:-10}
        LEARNINGPYRAMID_FRONTEND_DIST_FINGERPRINT: ${LEARNINGPYRAMID_FRONTEND_DIST_FINGERPRINT:-}
    ports:
      - "${LEARNINGPYRAMID_PORT:-8001}:8001"
    environment:
      LEARNINGPYRAMID_APP_MODE: ${LEARNINGPYRAMID_APP_MODE:-hosted}
      LEARNINGPYRAMID_PORT: 8001
      LEARNINGPYRAMID_BIND_HOST: 0.0.0.0
      LEARNINGPYRAMID_SQL_BACKEND: ${LEARNINGPYRAMID_SQL_BACKEND:-sqlite}
      LEARNINGPYRAMID_POSTGRES_DSN: ${LEARNINGPYRAMID_POSTGRES_DSN:-}
      LEARNINGPYRAMID_LOG_LEVEL: ${LEARNINGPYRAMID_LOG_LEVEL:-INFO}
      LEARNINGPYRAMID_POSTGRES_CONNECT_TIMEOUT: ${LEARNINGPYRAMID_POSTGRES_CONNECT_TIMEOUT:-5}
      LEARNINGPYRAMID_POSTGRES_POOL_ACQUIRE_TIMEOUT: ${LEARNINGPYRAMID_POSTGRES_POOL_ACQUIRE_TIMEOUT:-10}
      LEARNINGPYRAMID_POSTGRES_POOL_MIN_SIZE: ${LEARNINGPYRAMID_POSTGRES_POOL_MIN_SIZE:-1}
      LEARNINGPYRAMID_POSTGRES_POOL_MAX_SIZE: ${LEARNINGPYRAMID_POSTGRES_POOL_MAX_SIZE:-8}
      LEARNINGPYRAMID_POSTGRES_STATEMENT_TIMEOUT_MS: ${LEARNINGPYRAMID_POSTGRES_STATEMENT_TIMEOUT_MS:-30000}
      LEARNINGPYRAMID_POSTGRES_LOCK_TIMEOUT_MS: ${LEARNINGPYRAMID_POSTGRES_LOCK_TIMEOUT_MS:-5000}
      LEARNINGPYRAMID_POSTGRES_IDLE_IN_TX_TIMEOUT_MS: ${LEARNINGPYRAMID_POSTGRES_IDLE_IN_TX_TIMEOUT_MS:-30000}
      LEARNINGPYRAMID_STORE_DB_PATH: /data/learningpyramid_store.sqlite3
      LEARNINGPYRAMID_AUTH_DB_PATH: /data/learningpyramid_auth.sqlite3
      LEARNINGPYRAMID_ENABLE_AUTH: ${LEARNINGPYRAMID_ENABLE_AUTH:-true}
      LEARNINGPYRAMID_ALLOW_SIGNUP: ${LEARNINGPYRAMID_ALLOW_SIGNUP:-false}
      LEARNINGPYRAMID_REQUIRE_SIGNUP_INVITE: ${LEARNINGPYRAMID_REQUIRE_SIGNUP_INVITE:-true}
      LEARNINGPYRAMID_BOOTSTRAP_SUPER_ADMIN_EMAILS: ${LEARNINGPYRAMID_BOOTSTRAP_SUPER_ADMIN_EMAILS:-}
      LEARNINGPYRAMID_ENABLE_PASSWORD_RESET: ${LEARNINGPYRAMID_ENABLE_PASSWORD_RESET:-false}
      LEARNINGPYRAMID_PASSWORD_RESET_TOKEN_TTL_MINUTES: ${LEARNINGPYRAMID_PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      LEARNINGPYRAMID_ENABLE_EMAIL_VERIFICATION: ${LEARNINGPYRAMID_ENABLE_EMAIL_VERIFICATION:-false}
      LEARNINGPYRAMID_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: ${LEARNINGPYRAMID_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:-1440}
      LEARNINGPYRAMID_ENABLE_SIGNUP_HUMAN_CHECK: ${LEARNINGPYRAMID_ENABLE_SIGNUP_HUMAN_CHECK:-false}
      LEARNINGPYRAMID_ALTCHA_HMAC_SECRET: ${LEARNINGPYRAMID_ALTCHA_HMAC_SECRET:-}
      LEARNINGPYRAMID_ALTCHA_CHALLENGE_URL: ${LEARNINGPYRAMID_ALTCHA_CHALLENGE_URL:-/api/auth/human-check/challenge}
      LEARNINGPYRAMID_ALTCHA_ALGORITHM: ${LEARNINGPYRAMID_ALTCHA_ALGORITHM:-SHA-256}
      LEARNINGPYRAMID_ALTCHA_COST: ${LEARNINGPYRAMID_ALTCHA_COST:-1000}
      LEARNINGPYRAMID_ALTCHA_CHALLENGE_TTL_SECONDS: ${LEARNINGPYRAMID_ALTCHA_CHALLENGE_TTL_SECONDS:-600}
      LEARNINGPYRAMID_SMTP_HOST: ${LEARNINGPYRAMID_SMTP_HOST:-}
      LEARNINGPYRAMID_SMTP_PORT: ${LEARNINGPYRAMID_SMTP_PORT:-587}
      LEARNINGPYRAMID_SMTP_USERNAME: ${LEARNINGPYRAMID_SMTP_USERNAME:-}
      LEARNINGPYRAMID_SMTP_PASSWORD: ${LEARNINGPYRAMID_SMTP_PASSWORD:-}
      LEARNINGPYRAMID_SMTP_USE_SSL: ${LEARNINGPYRAMID_SMTP_USE_SSL:-false}
      LEARNINGPYRAMID_SMTP_USE_STARTTLS: ${LEARNINGPYRAMID_SMTP_USE_STARTTLS:-true}
      LEARNINGPYRAMID_SMTP_FROM_EMAIL: ${LEARNINGPYRAMID_SMTP_FROM_EMAIL:-}
      LEARNINGPYRAMID_SMTP_FROM_NAME: ${LEARNINGPYRAMID_SMTP_FROM_NAME:-LearningPyramid}
      LEARNINGPYRAMID_SMTP_TIMEOUT_SECONDS: ${LEARNINGPYRAMID_SMTP_TIMEOUT_SECONDS:-10}
      LEARNINGPYRAMID_ENABLE_ASR: ${LEARNINGPYRAMID_ENABLE_ASR:-false}
      LEARNINGPYRAMID_ENABLE_SERVER_MEDIA_STREAM: ${LEARNINGPYRAMID_ENABLE_SERVER_MEDIA_STREAM:-false}
      LEARNINGPYRAMID_ENABLE_BROWSER_LOCAL_MEDIA: ${LEARNINGPYRAMID_ENABLE_BROWSER_LOCAL_MEDIA:-true}
      LEARNINGPYRAMID_ENABLE_BAIDU_NETDISK: ${LEARNINGPYRAMID_ENABLE_BAIDU_NETDISK:-false}
      LEARNINGPYRAMID_BAIDU_NETDISK_CLIENT_ID: ${LEARNINGPYRAMID_BAIDU_NETDISK_CLIENT_ID:-}
      LEARNINGPYRAMID_BAIDU_NETDISK_CLIENT_SECRET: ${LEARNINGPYRAMID_BAIDU_NETDISK_CLIENT_SECRET:-}
      LEARNINGPYRAMID_BAIDU_NETDISK_REDIRECT_URI: ${LEARNINGPYRAMID_BAIDU_NETDISK_REDIRECT_URI:-}
      LEARNINGPYRAMID_BAIDU_NETDISK_SCOPE: ${LEARNINGPYRAMID_BAIDU_NETDISK_SCOPE:-basic,netdisk}
      LEARNINGPYRAMID_TOKEN_ENCRYPTION_KEY: ${LEARNINGPYRAMID_TOKEN_ENCRYPTION_KEY:-}
      LEARNINGPYRAMID_ENABLE_API_DOCS: ${LEARNINGPYRAMID_ENABLE_API_DOCS:-false}
      LEARNINGPYRAMID_DATA_DIR: /data
      LEARNINGPYRAMID_SECURE_COOKIES: ${LEARNINGPYRAMID_SECURE_COOKIES:-true}
      LEARNINGPYRAMID_PUBLIC_HOST: ${LEARNINGPYRAMID_PUBLIC_HOST:-}
      LEARNINGPYRAMID_PUBLIC_ORIGIN: ${LEARNINGPYRAMID_PUBLIC_ORIGIN:-}
      LEARNINGPYRAMID_ALLOWED_ORIGINS: ${LEARNINGPYRAMID_ALLOWED_ORIGINS:-}
      LEARNINGPYRAMID_TRUSTED_HOSTS: ${LEARNINGPYRAMID_TRUSTED_HOSTS:-}
      LEARNINGPYRAMID_PROXY_HEADERS: ${LEARNINGPYRAMID_PROXY_HEADERS:-true}
      LEARNINGPYRAMID_FORWARDED_ALLOW_IPS: ${LEARNINGPYRAMID_FORWARDED_ALLOW_IPS:-127.0.0.1}
      LEARNINGPYRAMID_MEDIA_ACCESS_TOKEN_TTL_SECONDS: ${LEARNINGPYRAMID_MEDIA_ACCESS_TOKEN_TTL_SECONDS:-14400}
      LEARNINGPYRAMID_MEDIA_ACCESS_TOKEN_SECRET: ${LEARNINGPYRAMID_MEDIA_ACCESS_TOKEN_SECRET:-}
      LEARNINGPYRAMID_WECHAT_PAY_APP_ID: ${LEARNINGPYRAMID_WECHAT_PAY_APP_ID:-}
      LEARNINGPYRAMID_WECHAT_PAY_MCH_ID: ${LEARNINGPYRAMID_WECHAT_PAY_MCH_ID:-}
      LEARNINGPYRAMID_WECHAT_PAY_CERT_SERIAL_NO: ${LEARNINGPYRAMID_WECHAT_PAY_CERT_SERIAL_NO:-}
      LEARNINGPYRAMID_WECHAT_PAY_API_V3_KEY: ${LEARNINGPYRAMID_WECHAT_PAY_API_V3_KEY:-}
      LEARNINGPYRAMID_WECHAT_PAY_PRIVATE_KEY_PEM_PATH: ${LEARNINGPYRAMID_WECHAT_PAY_PRIVATE_KEY_PEM_PATH:-}
      LEARNINGPYRAMID_WECHAT_PAY_PUBLIC_KEY_ID: ${LEARNINGPYRAMID_WECHAT_PAY_PUBLIC_KEY_ID:-}
      LEARNINGPYRAMID_WECHAT_PAY_PUBLIC_KEY_PEM_PATH: ${LEARNINGPYRAMID_WECHAT_PAY_PUBLIC_KEY_PEM_PATH:-}
      LEARNINGPYRAMID_WECHAT_PAY_NOTIFY_URL: ${LEARNINGPYRAMID_WECHAT_PAY_NOTIFY_URL:-}
      LEARNINGPYRAMID_WECHAT_PAY_REFUND_NOTIFY_URL: ${LEARNINGPYRAMID_WECHAT_PAY_REFUND_NOTIFY_URL:-}
      LEARNINGPYRAMID_WECHAT_PAY_API_BASE_URL: ${LEARNINGPYRAMID_WECHAT_PAY_API_BASE_URL:-https://api.mch.weixin.qq.com}
      LEARNINGPYRAMID_WECHAT_PAY_TIMEOUT_SECONDS: ${LEARNINGPYRAMID_WECHAT_PAY_TIMEOUT_SECONDS:-10}
      LEARNINGPYRAMID_WECHAT_PAY_DESCRIPTION_PREFIX: ${LEARNINGPYRAMID_WECHAT_PAY_DESCRIPTION_PREFIX:-LearningPyramid 月会员}
      LEARNINGPYRAMID_WECHAT_PAY_APP_SECRET: ${LEARNINGPYRAMID_WECHAT_PAY_APP_SECRET:-}
      LEARNINGPYRAMID_WECHAT_PAY_PAYOUT_PROVIDER_MODE: ${LEARNINGPYRAMID_WECHAT_PAY_PAYOUT_PROVIDER_MODE:-wechat_native}
      LEARNINGPYRAMID_WECHAT_PAY_BINDING_QR_TTL_MINUTES: ${LEARNINGPYRAMID_WECHAT_PAY_BINDING_QR_TTL_MINUTES:-10}
      LEARNINGPYRAMID_WECHAT_PAY_TRANSFER_SCENE_ID: ${LEARNINGPYRAMID_WECHAT_PAY_TRANSFER_SCENE_ID:-}
      LEARNINGPYRAMID_WECHAT_PAY_TRANSFER_REMARK: ${LEARNINGPYRAMID_WECHAT_PAY_TRANSFER_REMARK:-会员邀请佣金提现}
      LEARNINGPYRAMID_WECHAT_PAY_USER_RECV_PERCEPTION: ${LEARNINGPYRAMID_WECHAT_PAY_USER_RECV_PERCEPTION:-}
      LEARNINGPYRAMID_WECHAT_PAY_TRANSFER_NOTIFY_URL: ${LEARNINGPYRAMID_WECHAT_PAY_TRANSFER_NOTIFY_URL:-}
      LEARNINGPYRAMID_WECHAT_PAY_TRANSFER_SCENE_REPORT_INFOS_JSON: ${LEARNINGPYRAMID_WECHAT_PAY_TRANSFER_SCENE_REPORT_INFOS_JSON:-}
      LEARNINGPYRAMID_WECHAT_PAY_OAUTH_AUTHORIZE_URL: ${LEARNINGPYRAMID_WECHAT_PAY_OAUTH_AUTHORIZE_URL:-https://open.weixin.qq.com/connect/oauth2/authorize}
      LEARNINGPYRAMID_WECHAT_PAY_OAUTH_TOKEN_URL: ${LEARNINGPYRAMID_WECHAT_PAY_OAUTH_TOKEN_URL:-https://api.weixin.qq.com/sns/oauth2/access_token}
      LEARNINGPYRAMID_MEMBERSHIP_COMMISSION_REFUND_WINDOW_MINUTES: ${LEARNINGPYRAMID_MEMBERSHIP_COMMISSION_REFUND_WINDOW_MINUTES:-1440}
      LEARNINGPYRAMID_MEMBERSHIP_PENDING_PAYMENT_RECONCILE_MIN_AGE_MINUTES: ${LEARNINGPYRAMID_MEMBERSHIP_PENDING_PAYMENT_RECONCILE_MIN_AGE_MINUTES:-5}
      LEARNINGPYRAMID_MEMBERSHIP_PENDING_PAYMENT_RECONCILE_LIMIT: ${LEARNINGPYRAMID_MEMBERSHIP_PENDING_PAYMENT_RECONCILE_LIMIT:-100}
    volumes:
      - ./data/selfhost:/data
      - ./data/selfhost:/app/data
      - ${LEARNINGPYRAMID_WECHAT_PAY_CERTS_DIR:-./certs}:/app/certs:ro
      - ./public-downloads:/app/public-downloads:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; host=(os.getenv('LEARNINGPYRAMID_PUBLIC_HOST') or next((item.strip() for item in os.getenv('LEARNINGPYRAMID_TRUSTED_HOSTS', '').split(',') if item.strip()), 'localhost')); req=urllib.request.Request('http://127.0.0.1:8001/api/health/live', headers={'Host': host}); urllib.request.urlopen(req, timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
