services:
  app:
    environment:
      LEARNINGPYRAMID_SQL_BACKEND: postgres
      LEARNINGPYRAMID_POSTGRES_DSN: ${LEARNINGPYRAMID_POSTGRES_DSN:-postgresql://learningpyramid:learningpyramid@postgres:5432/learningpyramid}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${LEARNINGPYRAMID_POSTGRES_DB:-learningpyramid}
      POSTGRES_USER: ${LEARNINGPYRAMID_POSTGRES_USER:-learningpyramid}
      POSTGRES_PASSWORD: ${LEARNINGPYRAMID_POSTGRES_PASSWORD:-learningpyramid}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEARNINGPYRAMID_POSTGRES_USER:-learningpyramid} -d ${LEARNINGPYRAMID_POSTGRES_DB:-learningpyramid}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
