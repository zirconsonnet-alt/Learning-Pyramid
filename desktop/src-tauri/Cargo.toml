[package]
name = "learningpyramid-desktop"
version = "0.1.0"
description = "LearningPyramid Windows desktop client"
authors = ["LearningPyramid"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "learningpyramid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tiny_http = "0.12.0"
reqwest = { version = "0.13.3", features = ["blocking"] }
uuid = { version = "1.23.1", features = ["v4"] }
rfd = { version = "0.15.4", default-features = false, features = ["common-controls-v6"] }
